name: Autonomous demo publication guard

on:
  pull_request:
    paths:
      - 'autonomy/**'
      - 'docs/autonomous-demo/**'
      - 'tools/public_repo_guard.py'
      - 'tools/publication_audit.py'
      - '.githooks/**'

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan PR diff for secrets/private artifacts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/public_repo_guard.py --diff-base "$BASE_SHA"
      - name: Guard self-tests
        run: python3 -m pytest -q tools/test_public_repo_guard.py
